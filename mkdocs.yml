# Configurazione del sito rpsd-doc, letta da Zensical (fase 1: niente zensical.toml).
# Opzioni verificate sulla documentazione Zensical: vedi
# openspec/changes/bootstrap-site/design.md, tabella "Verifiche".
# Navigazione: nessun `nav` qui; è definita per directory dai file .nav.yml in docs/ (awesome-nav).

site_name: Rapsodia — Documentazione
site_description: Documentazione dei profili NeTEx e SIRI italiani e degli indicatori ART per Rapsodia
site_url: https://agenzia-tpl.github.io/rpsd-doc/
repo_url: https://github.com/Agenzia-TPL/rpsd-doc
docs_dir: docs

theme:
  name: material
  # Override del template: avviso sulle versioni di profilo non correnti (overrides/main.html)
  custom_dir: overrides
  variant: classic
  language: it
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/sun
        name: Passa allo schema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Passa allo schema chiaro
  features:
    - navigation.tabs
    - navigation.indexes
    # navigation.expand e navigation.sections deliberatamente assenti (design del sito §2.2):
    # con sections i gruppi di secondo livello resterebbero sempre aperti, contro la spec
    # site-navigation (solo il ramo della pagina corrente espanso).
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  # search è elencato esplicitamente: con `plugins` presente, MkDocs/Material
  # disattiverebbe la ricerca se mancasse. awesome-nav è integrato in Zensical.
  - search
  # URL stabili: spostando o rinominando una pagina pubblicata, aggiungere qui
  # vecchio/percorso.md: nuovo/percorso.md (controllato da scripts/check_urls.py).
  - redirects:
      redirect_maps:
        # Alias della versione corrente dei profili (profile-versioning)
        netex/corrente/index.md: netex/5.0.0/index.md
        siri/corrente/index.md: siri/1.0.5/index.md
  - awesome-nav:
      logs:
        # TODO: riportare a `warning` quando ogni sezione che usa "*" nel proprio
        # .nav.yml avrà almeno una pagina oltre a index.md (dopo i change 8 e 9,
        # vedi openspec/seed.md §5). Finché le sezioni sono segnaposto, "*" non
        # trova nulla e con `warning` il build strict fallirebbe.
        no_matches: info

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Link permanente
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Versioni dei profili documentate (profile-versioning). Unico punto da aggiornare
# quando cambia la versione corrente: vedi CONTRIBUTING.md, "Profili versionati".
# Stati ammessi: corrente, precedente, ritirata. Controllato da scripts/check_versions.py.
extra:
  profili:
    netex:
      titolo: NeTEx
      corrente: "5.0.0"
      versioni:
        "5.0.0": corrente
    siri:
      titolo: SIRI
      corrente: "1.0.5"
      versioni:
        "1.0.5": corrente
