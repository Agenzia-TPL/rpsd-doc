# Controllo sulle pull request: build strict del sito e verifiche dello spike.
# Per renderlo obbligatorio prima del merge serve la branch protection su main
# (passo manuale, vedi README).
name: Controllo PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build strict del sito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - run: zensical build --strict

  spike:
    name: Spike (scala, sidebar, link rotti)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build delle pagine di prova con 400 pagine (limite 60 s) e controllo sidebar
        run: python scripts/spike.py --scale
      - name: Il build strict deve fallire su link e anchor rotti
        run: python scripts/check_broken_link.py
