# Controllo sulle pull request: build strict del sito e verifiche dello spike.
# Per renderlo obbligatorio prima del merge serve la branch protection su main
# (passo manuale, vedi README).
name: Controllo PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build strict del sito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - run: zensical build --strict
      - name: Tab di primo livello nell'ordine richiesto e tab attivo corretto
        run: python scripts/check_navigation.py

  spike:
    name: Spike (scala, sidebar, link rotti)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build delle pagine di prova con 400 pagine (limite 60 s) e controllo sidebar (anche pagina a tre livelli)
        run: python scripts/spike.py --scale
      - name: Il build strict deve fallire su link e anchor rotti
        run: python scripts/check_broken_link.py
      - name: Una sottosezione nuova compare senza modificare la configurazione
        run: python scripts/check_new_subsection.py
