# Pubblicazione su GitHub Pages solo alle release del sito: push di un tag vX.Y.Z
# (o avvio manuale su un tag), se il controllo della release e il build strict
# riescono. Il merge su main non pubblica nulla (spec site-releases, CONTRIBUTING).
# Richiede Pages con sorgente "GitHub Actions" e, nell'ambiente github-pages, la
# regola di deploy per i tag v* (passi manuali, vedi README).
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build strict
    runs-on: ubuntu-latest
    steps:
      # Storia completa e branch remoti: il controllo verifica che il tag sia su main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      # Il ref deve essere un tag annotato vX.Y.Z su main, uguale alla prima riga di
      # docs/rapsodia/release.md; da un branch (avvio manuale) il controllo fallisce.
      # Tag riscaricati dal remoto: checkout può registrare il tag dell'evento come tag
      # leggero, e R4 richiede il tag annotato.
      - name: Controllo della release
        run: |
          git fetch --force --tags origin
          python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      # Se il build fallisce il job si ferma qui: l'artifact non viene caricato
      # (Zensical scrive site/ anche quando il build strict fallisce).
      - run: zensical build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Pubblicazione
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
